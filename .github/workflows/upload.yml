name: Upload Images

on:
  push:
    branches:
      - main
    paths:
      - "images/**"
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Sharp
        run: npm install sharp

      - name: Generate thumbnails
        run: |
          node << 'EOF'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');

          const imagesDir = './images';
          const files = fs.readdirSync(imagesDir).filter(f => /^\d+\.jpg$/.test(f));

          async function generateThumbnails() {
            console.log(`Found ${files.length} images to process`);

            for (const file of files) {
              const inputPath = path.join(imagesDir, file);
              const outputPath = path.join(imagesDir, file.replace('.jpg', '-small.jpg'));

              try {
                const metadata = await sharp(inputPath).metadata();
                const isPortrait = metadata.height > metadata.width;

                await sharp(inputPath)
                  .resize(280, 280, {
                    fit: 'cover',
                    position: isPortrait ? 'top' : 'center'
                  })
                  .jpeg({ quality: 80, mozjpeg: true })
                  .toFile(outputPath);

                console.log(`Generated: ${file.replace('.jpg', '-small.jpg')}`);
              } catch (err) {
                console.error(`Failed: ${file} - ${err.message}`);
              }
            }

            console.log('Thumbnail generation complete');
          }

          generateThumbnails();
          EOF

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload images to S3
        run: |
          aws s3 sync images/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --cache-control "max-age=31536000" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_ID }} \
            --paths "/*"
